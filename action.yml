name: Octestra
description: Portable GitHub issue lifecycle and agent loop operations

inputs:
  operation:
    description: Operation to run. Task-state operations use lifecycle/<verb>, loops use loop/<verb>, and scope-neutral pieces use a bare <verb>.
    required: true
  github-token:
    description: GitHub App token used for API requests
    required: true
  issue-number:
    description: Issue number; lifecycle operations use a task and loop operations use an EPIC
    required: false
  trigger-actor:
    description: User that initiated or started the task
    required: false
  trigger-actor-type:
    description: GitHub sender type that initiated the field change
    required: false
  previous-status:
    description: AI Task Status before the observed transition
    required: false
  current-status:
    description: AI Task Status after the observed transition
    required: false
  config-ref:
    description: Optional config branch/ref; default is the repository default branch
    required: false
  branch-name:
    description: Explicit branch name for the individual resolve-task-pr operation
    required: false
  proof-path:
    description: Deprecated path to a validation result JSON file; use result-path
    required: false
  result-path:
    description: Path to an agent-generated validation or triage result JSON file
    required: false
  pull-number:
    description: Task pull request number
    required: false
  next-status:
    description: Status used by the individual update-status operation
    required: false
  status-field-name:
    description: Organization issue field name override; must be paired with status-field-id
    required: false
  status-field-id:
    description: Organization issue field ID override; must be paired with status-field-name
    required: false
outputs:
  status_key:
    description: Configured status key emitted by lifecycle transition validation
  transition_valid:
    description: Whether the observed state transition is allowed
  parent_number:
    description: Parent EPIC issue number
  task_skill:
    description: Optional task skill configured by the parent EPIC
  validation_skill:
    description: Validation skill configured by the parent EPIC
  epic_id:
    description: Stable identifier configured by the parent EPIC
  branch_name:
    description: Deterministic task branch resolved from the EPIC ID and issue number
  task_ready:
    description: Whether task execution may proceed; false when existing branch or PR work was found
  draft_flag:
    description: --draft when the task should create a draft PR
  skip_validation:
    description: Whether the task goes straight to Human Review instead of Validation
  prompt:
    description: Rendered task prompt
  pull_number:
    description: Linked task pull request number
  result_path:
    description: Path where a validation or triage agent must write its result
  artifact_path:
    description: Directory where the validation agent must save artifacts
  target:
    description: Optional file, class, feature, or other target from the task-config block
  reviewer:
    description: Task owner requested to review the pull request
  task_owner:
    description: Human responsible for the task and pull request
  outcome:
    description: Outcome read from a validation result JSON file
  summary:
    description: Summary read from a validation result JSON file
  epics:
    description: JSON matrix entries for open EPIC issue numbers enabled for Todo triage
  count:
    description: Number of EPICs enabled for Todo triage
  ready_count:
    description: Number of Todo tasks moved to Ready by loop/finalize-triage

runs:
  using: node24
  main: dist/index.js
