name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json (for example, 0.1.0)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 24

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Validate release
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "release must be dispatched from $DEFAULT_BRANCH" >&2
            exit 1
          fi

          git fetch origin "$DEFAULT_BRANCH" --tags --force
          default_sha=$(git rev-parse "origin/$DEFAULT_BRANCH")
          if [[ "$GITHUB_SHA" != "$default_sha" ]]; then
            echo "release commit $GITHUB_SHA is not the latest $DEFAULT_BRANCH commit $default_sha" >&2
            exit 1
          fi

          major_tag=$(bash scripts/release-version.sh "$VERSION")
          version_tag="v$VERSION"
          echo "major_tag=$major_tag" >> "$GITHUB_OUTPUT"
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"

          if gh release view "$version_tag" >/dev/null 2>&1; then
            echo "release already exists: $version_tag" >&2
            exit 1
          fi

          existing_commit=$(git rev-parse --verify "refs/tags/$version_tag^{commit}" 2>/dev/null || true)
          if [[ -n "$existing_commit" && "$existing_commit" != "$GITHUB_SHA" ]]; then
            echo "tag $version_tag points at $existing_commit, not $GITHUB_SHA" >&2
            exit 1
          fi
          if [[ -n "$existing_commit" && "$(git cat-file -t "refs/tags/$version_tag")" != "tag" ]]; then
            echo "existing release tag $version_tag is not annotated" >&2
            exit 1
          fi

          latest_version=$(
            { git tag --list |
            sed -nE 's/^v?((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$/\1/p' || true; } |
            sort -V |
            tail -n 1
          )
          if [[ -n "$latest_version" && "$latest_version" != "$VERSION" ]]; then
            newest=$(printf '%s\n%s\n' "$latest_version" "$VERSION" | sort -V | tail -n 1)
            if [[ "$newest" != "$VERSION" ]]; then
              echo "version $VERSION must be newer than existing tag $latest_version" >&2
              exit 1
            fi
          fi

      - run: npm ci

      - run: make all

      - name: Verify committed bundle
        run: git diff --exit-code

      - name: Publish release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          MAJOR_TAG: ${{ steps.release.outputs.major_tag }}
          VERSION_TAG: ${{ steps.release.outputs.version_tag }}
        run: |
          git fetch origin "$DEFAULT_BRANCH" --tags --force
          default_sha=$(git rev-parse "origin/$DEFAULT_BRANCH")
          if [[ "$GITHUB_SHA" != "$default_sha" ]]; then
            echo "$DEFAULT_BRANCH moved to $default_sha while the release was running" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git show-ref --verify --quiet "refs/tags/$VERSION_TAG"; then
            git tag -a "$VERSION_TAG" -m "Release $VERSION_TAG" "$GITHUB_SHA"
          fi
          git push origin "refs/tags/$VERSION_TAG"

          git tag -fa "$MAJOR_TAG" -m "Update $MAJOR_TAG to $VERSION_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$MAJOR_TAG" --force

          gh release create "$VERSION_TAG" \
            --generate-notes \
            --latest \
            --title "$VERSION_TAG" \
            --verify-tag
