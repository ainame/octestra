# Octestra settings for this repository. The only file install.sh generates, and the only
# one it keeps as it is when you run an update.
version: 1

github_app:
  client_id: "YOUR-GITHUB-APP-CLIENT-ID" # copied into OCTESTRA_GITHUB_APP_CLIENT_ID
  # Name of the Actions secret holding this App's private key. This is copied into
  # OCTESTRA_GITHUB_APP_PRIVATE_KEY_SECRET; the secret value is never stored here.
  private_key_secret_key_name: "OCTESTRA_GITHUB_APP_PRIVATE_KEY"

runners: # copied into this repository's variables
  orchestration: ubuntu-latest
  agent: ubuntu-latest

status:
  # Octestra sets a status by its option display name, so renaming an option in the
  # organization breaks this installation. install.sh checks all seven names exist.
  field_name: "__OCTESTRA_STATUS_FIELD_NAME__"
  # Used only to route the Issue Field event. octestra-lifecycle.yml compares it before
  # any job can read this file, so it is copied into a repository variable as well.
  field_id: "__OCTESTRA_STATUS_FIELD_ID__" # copied into OCTESTRA_STATUS_FIELD_ID

branch:
  task: "octestra/{epic_id}/issue-{issue_number}"

prompts:
  lifecycle_in_progress: .github/octestra/prompts/lifecycle-in-progress.md.hbs
  lifecycle_validation: .github/octestra/prompts/lifecycle-validation.md.hbs
  loop_todo: .github/octestra/prompts/loop-todo.md.hbs

# Agent time caps, in whole minutes from 1 to 350. Each value caps the workflow step that runs
# your local agent action (task-agent, validation-agent, triage-agent), setup steps inside the
# action included. Every key is optional and defaults to 50; a validation that builds an app and
# drives a simulator typically needs more than a task that edits code.
#
# How a value reaches the workflow, with validation: 80 as the example:
#   1. The guard job's validate-transition step reads this file and publishes
#      job_timeout_minutes = 80 + 10. The 10 minutes are for Octestra's own steps around the
#      agent: App token, checkout, prepare, token renewal, artifact upload, finalize.
#   2. The validation job's timeout-minutes reads that output through needs.guard: 90 minutes.
#   3. The job's prepare-validation step publishes agent_timeout_minutes = 80.
#   4. The "Run validation agent" step's timeout-minutes reads that output: 80 minutes.
# The task job works the same way through prepare-task, and the Todo loop through
# loop/list-epics (job) and loop/prepare-triage (step). When the agent cap hits, that step
# fails, the steps inside your action stop, and Octestra still uploads the evidence saved so
# far and reports the failure.
# agent_timeout_minutes:
#   task: 50
#   validation: 80
#   triage: 50
