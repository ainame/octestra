# Octestra control plane. This is the only file generated by install.sh.
version: 1

github_app:
  client_id: "YOUR-GITHUB-APP-CLIENT-ID" # mirrored to OCTESTRA_GITHUB_APP_CLIENT_ID

runners: # mirrored to repository variables
  orchestration: ubuntu-latest
  agent: ubuntu-latest

status:
  field_name: "__OCTESTRA_STATUS_FIELD_NAME__"
  field_id: "__OCTESTRA_STATUS_FIELD_ID__" # mirrored to OCTESTRA_STATUS_FIELD_ID
  # Option IDs are the authoritative identity and intentionally are not mirrored to
  # vars. The keys below are Octestra's status vocabulary: loops and the individual
  # update-status operation refer to a status by key, never by display name, so
  # renaming an option in the organization does not break an installation.
  options:
    todo: "__OCTESTRA_STATUS_TODO_OPTION_ID__"
    ready: "__OCTESTRA_STATUS_READY_OPTION_ID__"
    in_progress: "__OCTESTRA_STATUS_IN_PROGRESS_OPTION_ID__"
    validation: "__OCTESTRA_STATUS_VALIDATION_OPTION_ID__"
    human_review: "__OCTESTRA_STATUS_HUMAN_REVIEW_OPTION_ID__"
    blocked: "__OCTESTRA_STATUS_BLOCKED_OPTION_ID__"
    done: "__OCTESTRA_STATUS_DONE_OPTION_ID__"

branch:
  task: "octestra/{epic_id}/issue-{issue_number}"
  loop: "octestra/loop/{loop_id}/{run_number}"

prompts:
  lifecycle_in_progress: .github/octestra/prompts/lifecycle-in-progress.md.hbs
  lifecycle_validation: .github/octestra/prompts/lifecycle-validation.md.hbs

# Loops are opt-in. Copy the reference workflow and uncomment/configure an entry.
# loops:
#   # Fan-out loop: one agent run per selected issue. Copy octestra-loop-triage-todo.yml.
#   triage-todo:
#     prompt: .github/octestra/prompts/loop-triage-todo.md.hbs
#     select:
#       epic: null              # An EPIC number; null requires non-empty labels.
#       status: todo            # A status key from status.options above.
#       labels: []
#       updated_before: 24h     # Idempotency guard; supported units: s, m, h, d, w.
#       limit: 10               # Maximum selected tasks.
#       scan_budget: 300        # Maximum candidates examined, independent of limit.
#       order: oldest
#     apply:
#       allowed_status: [ready, blocked]   # Status keys the loop may apply.
#       assign_owner: true
#       dry_run: false
#     report_issue: null
#
#   # Aggregate loop: one agent run over the whole selection. Copy
#   # octestra-loop-retrospective.yml alongside this entry. `report_issue` is required, because an
#   # aggregate run has no single task to comment on.
#   retrospective:
#     prompt: .github/octestra/prompts/loop-retrospective.md.hbs
#     select:
#       epic: null
#       status: done
#       labels: [octestra-task]
#       updated_before: 7d
#       limit: 20
#       scan_budget: 300
#       order: newest
#     apply:
#       allowed_status: []     # An aggregate run never moves a task.
#       assign_owner: false
#       dry_run: false
#     report_issue: 1          # Issue that receives the retrospective summary.
