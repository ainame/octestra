# Repository-owned setup and agent execution for an Octestra task. Octestra installs this file only
# when it does not already exist; later updates preserve the whole file.
#
# WHAT STEPS MAY REFERENCE
# Use `inputs.*` for task context and `env.OCTESTRA_AGENT_GITHUB_TOKEN` for the agent's GitHub token.
# Composite actions cannot read the `secrets` context directly. Prefer OIDC or credentials already
# available on the configured runner.
name: Octestra task agent
description: Repository-configured setup and agent execution for an Octestra task

inputs:
  issue_number:
    description: Task issue number
    required: true
  parent_number:
    description: Parent EPIC issue number
    required: true
  epic_id:
    description: Stable identifier configured by the parent EPIC
    required: true
  task_skill:
    description: Task agent skill configured by the parent EPIC, if any
    required: false
  branch_name:
    description: Exact branch the agent must create and push
    required: true
  draft_flag:
    description: --draft when the task pull request should remain a draft
    required: false
  skip_validation:
    description: Whether the task moves directly to Human Review
    required: true
  prompt:
    description: Rendered task instructions
    required: true
  target:
    description: Configured file, class, feature, or other target, if any
    required: false
  task_owner:
    description: Human assigned to the task issue
    required: true

runs:
  using: composite
  steps:
    - name: Configure task agent
      shell: bash
      run: |
        echo "::error::Replace this step with the repository's task agent configuration."
        exit 1

