# Repository-owned setup and agent execution for Octestra validation. Octestra installs this file
# only when it does not already exist; later updates preserve the whole file.
#
# WHAT STEPS MAY REFERENCE
# Use `inputs.*` for validation context and `env.OCTESTRA_AGENT_GITHUB_TOKEN` for the agent's GitHub
# token. Composite actions cannot read the `secrets` context directly. Prefer OIDC or credentials
# already available on the configured runner.
name: Octestra validation agent
description: Repository-configured setup and agent execution for Octestra validation

inputs:
  issue_number:
    description: Task issue number
    required: true
  parent_number:
    description: Parent EPIC issue number
    required: true
  validation_skill_name:
    description: Validation agent skill configured by the parent EPIC
    required: false
  branch_name:
    description: Checked-out task branch
    required: true
  pull_number:
    description: Pull request being validated
    required: true
  prompt:
    description: Rendered validation instructions
    required: true
  result_path:
    description: Path where the validation result JSON must be written
    required: true
  artifact_path:
    description: Directory for validation evidence
    required: true
  target:
    description: Configured file, class, feature, or other target, if any
    required: false

