name: Octestra Orchestrator

run-name: >-
  Octestra: ${{ github.event.issue_field_value.option.name || 'ignored field change' }}
  (issue #${{ github.event.issue.number }})

on:
  issues:
    types: [field_added, closed]

# Consumer configuration. Keep secrets in GitHub Actions Secrets instead of this block.
# YAML aliases pass these values because workflow-level env is not inherited by reusable workflows.
env:
  OCTESTRA_GITHUB_APP_CLIENT_ID: &github-app-client-id YOUR-GITHUB-APP-CLIENT-ID
  OCTESTRA_WORKFLOW_CONTEXT: &workflow-context |-
    {
      "runners": {
        "orchestration": "ubuntu-slim",
        "agent": "ubuntu-latest"
      },
      "branch": {
        "template": "octestra/{epic_id}/issue-{issue_number}"
      }
    }

# Required secret:
# OCTESTRA_GITHUB_APP_PRIVATE_KEY - the private key for this App client ID

permissions:
  contents: write
  # Enable only for OIDC federation, for example AWS IAM role assumption with
  # aws-actions/configure-aws-credentials; also enable it in octestra-lifecycle.yml.
  # id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: octestra-orchestrator-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Lifecycle
    # Cost optimization: skip known-valid transitions that need no arrival workflow.
    # Invalid transitions still reach the lifecycle guard and are restored; In Progress and
    # Validation still reach their agent workflows. Remove a transition below when it gains work.
    if: >-
      github.event.issue_field.id == __OCTESTRA_STATUS_FIELD_ID__ &&
      github.event.issue_field.field_type == 'single_select' &&
      !contains(
        fromJSON(
          '[
            "->Todo",
            "Todo->Ready",
            "Blocked->Ready",
            "Ready->Blocked",
            "In Progress->Blocked",
            "Validation->Blocked",
            "Human Review->Blocked",
            "In Progress->Human Review",
            "Validation->Human Review",
            "Human Review->Done"
          ]'
        ),
        format(
          '{0}->{1}',
          github.event.changes.issue_field_value.from.option.name || '',
          github.event.issue_field_value.option.name || ''
        )
      )
    uses: ./.github/workflows/octestra-lifecycle.yml
    secrets:
      github_app_private_key: ${{ secrets.OCTESTRA_GITHUB_APP_PRIVATE_KEY }}
    with:
      # GitHub App
      github-app-client-id: *github-app-client-id

      # Issue, lifecycle state, and trigger context
      lifecycle-context: |
        {
          "issue_number": ${{ github.event.issue.number }},
          "status_field_name": __OCTESTRA_STATUS_FIELD_NAME_JSON__,
          "current_status": ${{ toJSON(github.event.issue_field_value.option.name || '') }},
          "previous_status": ${{ toJSON(github.event.changes.issue_field_value.from.option.name || '') }},
          "current_status_option_id": ${{ github.event.issue_field_value.option.id || 0 }},
          "status_option_ids": {
            "todo": __OCTESTRA_STATUS_TODO_OPTION_ID__,
            "ready": __OCTESTRA_STATUS_READY_OPTION_ID__,
            "in_progress": __OCTESTRA_STATUS_IN_PROGRESS_OPTION_ID__,
            "validation": __OCTESTRA_STATUS_VALIDATION_OPTION_ID__,
            "human_review": __OCTESTRA_STATUS_HUMAN_REVIEW_OPTION_ID__,
            "blocked": __OCTESTRA_STATUS_BLOCKED_OPTION_ID__,
            "done": __OCTESTRA_STATUS_DONE_OPTION_ID__
          },
          "trigger_actor": ${{ toJSON(github.actor) }},
          "trigger_actor_type": ${{ toJSON(github.event.sender.type) }}
        }

      # Shared workflow configuration: runner labels and task branch template.
      workflow-context: *workflow-context

  finalize-merged-task:
    name: Complete closed task
    if: github.event.action == 'closed'
    uses: ainame/octestra/.github/workflows/octestra-finalize-merged-task.yml@main
    secrets:
      github_app_private_key: ${{ secrets.OCTESTRA_GITHUB_APP_PRIVATE_KEY }}
    with:
      github-app-client-id: *github-app-client-id
      issue-number: ${{ github.event.issue.number }}
      status-field-name: __OCTESTRA_STATUS_FIELD_NAME_JSON__
      workflow-context: *workflow-context
