# Octestra validation workflow.
#
# Runs the repository-configured validation agent when a task enters the
# `Validation` AI Task Status. The agent evaluates the task pull request; this
# workflow then advances the task to Human Review or Blocked. The workflow is
# triggered by an issue-field event, not a pull_request event, so it explicitly
# checks out the resolved task branch before validation.
#
# UPDATING THIS FILE
# `.github/octestra/octestra.sh update` replaces this file, except for the regions between
#
#     # octestra:custom:begin <name>
#     # octestra:custom:end <name>
#
# whose contents are carried into the new version. Put repository-specific setup, agent
# invocation, and agent credentials inside those regions; anything outside them belongs to
# Octestra and is overwritten, so edits there are lost on the next install.
#
# The steps that must stay outside a custom region are prepare-validation, the checkouts it
# feeds, and finalize-validation: Octestra changes them as the lifecycle changes, and an
# installation that keeps an old copy will break. When an update cannot carry a region over —
# the markers were removed, or the region no longer exists — it saves the previous file as
# `octestra-lifecycle-validation.yml.octestra-bak` and says so.
name: Octestra - Validation (Task Verification)

on:
  workflow_call:
    inputs:
      issue-number:
        description: Task issue number
        required: true
        type: number

    secrets:
      # GitHub App
      github_app_private_key:
        description: Private key for the task GitHub App
        required: true

      # octestra:custom:begin agent-credentials
      # Declare the secrets the agent steps below need, and pass each one explicitly from
      # octestra-lifecycle.yml — `secrets: inherit` would hand every organization secret to
      # a job that executes an agent, so it is not used anywhere in Octestra.
      #
      #   your_agent_api_key:
      #     description: API key for the validation agent
      #     required: true
      # octestra:custom:end agent-credentials

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validation:
    name: Run validation agent
    runs-on: ${{ vars.OCTESTRA_AGENT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      # Use an App token so lifecycle updates can trigger follow-up workflows.
      - name: Generate a token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets.github_app_private_key }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      # prepare-validation:
      # - Loads the task and parent EPIC configuration.
      # - Resolves the linked open task pull request.
      # - Renders the consumer's validation prompt.
      # - Publishes the task branch, pull request, prompt, and result-file path as Action outputs.
      # Use build-validation-context directly when custom setup sequencing is required.
      #
      # **Keep prepare-validation as the first Octestra lifecycle action in this job.**
      - name: Prepare validation lifecycle
        id: epic
        uses: ainame/octestra@main
        with:
          operation: lifecycle/prepare-validation
          github-token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ inputs.issue-number }}

      - name: Checkout task branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.epic.outputs.branch_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout trusted workflow actions
        uses: actions/checkout@v7
        with:
          path: .trusted
          token: ${{ steps.app-token.outputs.token }}

      - name: Hide trusted actions from validation
        run: echo '/.trusted/' >> .git/info/exclude

      # octestra:custom:begin agent-steps
      # Everything between these markers is this repository's: environment and dependency
      # setup, credentials, the agent invocation itself, and any artifact upload. An update
      # carries it into the new version of this file.

      - name: Configure validation agent
        run: |
          echo "::error::Replace this step with the repository's validation agent configuration."
          exit 1

      # Example: configure cloud credentials with GitHub OIDC.
      #
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v6
      #   with:
      #     role-to-assume: arn:aws:iam::000000000000:role/example-role
      #     aws-region: example-region
      #
      # Example: replace the placeholder step above with Claude Code Action.
      # Do not set track_progress here: this workflow is triggered by an issue-field event.
      # Agent mode preserves the task branch checked out above instead of creating a branch.
      # `steps.epic.outputs.prompt` is rendered from
      # .github/octestra/prompts/lifecycle-validation.md.hbs.
      #
      # - name: Run Claude Code validation
      #   uses: anthropics/claude-code-action@v1
      #   with:
      #     github_token: ${{ steps.app-token.outputs.token }}
      #     use_bedrock: "true"
      #     claude_args: >-
      #       --model ${{ vars.BEDROCK_DEFAULT_OPUS_MODEL }}
      #       --allowedTools "Bash,Read,Write,Edit,Grep,Glob,mcp__XcodeBuildMCP__*"
      #     prompt: ${{ steps.epic.outputs.prompt }}

      # Upload partial evidence even when the validation agent fails.
      #
      # - name: Upload validation artifacts
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: octestra-validation-${{ inputs.issue-number }}
      #     path: |
      #       ${{ steps.epic.outputs.artifact_path }}
      #       ${{ steps.epic.outputs.result_path }}
      #     if-no-files-found: warn
      # octestra:custom:end agent-steps

      # finalize-validation:
      # - Reads the consumer-generated proof result and posts the formatted proof comment.
      # - Exposes the reported outcome without enforcing acceptance/check conventions.
      # - For a passed outcome, assigns the Issue task owner to the pull request and requests review.
      # - Moves passed results to Human Review and all other outcomes to Blocked.
      # Compose report-proof, request-review, and update-status for a custom policy.
      #
      # **Keep finalize-validation as the last Octestra lifecycle action in this job.**
      - name: Finalize validation lifecycle
        uses: ainame/octestra@main
        with:
          operation: lifecycle/finalize-validation
          github-token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ inputs.issue-number }}
          proof-path: ${{ steps.epic.outputs.result_path }}
          pull-number: ${{ steps.epic.outputs.pull_number }}

  report-failure:
    needs: validation
    if: ${{ always() && needs.validation.result != 'success' }}
    runs-on: ${{ vars.OCTESTRA_ORCHESTRATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # Use an App token so lifecycle updates can trigger follow-up workflows.
      - name: Generate a token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets.github_app_private_key }}

      - name: Report failure and advance to Blocked
        uses: ainame/octestra@main
        with:
          operation: lifecycle/report-failure
          github-token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ inputs.issue-number }}
