# Octestra validation workflow.
#
# Runs the repository-configured validation agent when a task enters the
# `Validation` AI Task Status. The agent evaluates the task pull request; this
# workflow then advances the task to Human Review or Blocked. The workflow is
# triggered by an issue-field event, not a pull_request event, so it explicitly
# checks out the resolved task branch before validation.
#
# UPDATING THIS FILE
# `.github/octestra/octestra.sh update` replaces this file, except for each custom region — the
# lines enclosed by a matching pair of
#
#     # octestra:custom:begin <name>
#     # octestra:custom:end <name>
#
# markers — whose contents it carries into the new version. Place this repository's setup, agent
# invocation and agent credentials inside a custom region; everything outside one is replaced, so
# edits there are lost on the next update.
#
# WHAT A CUSTOM REGION MAY REFERENCE
# An update preserves the contents of a custom region and replaces every step outside one, so a
# custom region may reference only names that survive that. These do:
#
#     steps.epic.outputs.*             the outputs listed on prepare-validation below
#     env.OCTESTRA_AGENT_GITHUB_TOKEN  the agent's GitHub token
#     secrets.*, vars.*, inputs.*      declared in this file or passed by the caller
#
# Do not refer to any other step by its id. If a later version removes that step, GitHub turns
# the reference into an empty string instead of reporting an error, and the agent runs with an
# empty value.
#
# Leave the `Prepare validation lifecycle` step, the checkout steps it feeds, and
# `Finalize validation lifecycle` outside the markers. Octestra keeps changing them, and an
# installation holding an old copy breaks. If an update cannot find a marker pair it expected
# — renamed or deleted by hand — it saves the previous file as
# `octestra-lifecycle-validation.yml.octestra-bak` and says so.
name: Octestra - Validation (Task Verification)

on:
  workflow_call:
    inputs:
      issue-number:
        description: Task issue number
        required: true
        type: number

    secrets:
      # GitHub App
      github_app_private_key:
        description: Private key for the task GitHub App
        required: true

      # octestra:custom:begin agent-credentials
      # Declare the secrets the agent steps below need, and pass each one explicitly from
      # octestra-lifecycle.yml. Do not use `secrets: inherit` here: it would hand every
      # organization secret to a job that runs an agent.
      #
      #   your_agent_api_key:
      #     description: API key for the validation agent
      #     required: true
      # octestra:custom:end agent-credentials

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validation:
    name: Run validation agent
    runs-on: ${{ vars.OCTESTRA_AGENT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      # An App token, not GITHUB_TOKEN: a change made with GITHUB_TOKEN starts no next run.
      - name: Generate a token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets.github_app_private_key }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      # prepare-validation:
      # - Loads the task issue and its parent EPIC.
      # - Finds the open pull request linked to the task.
      # - Renders .github/octestra/prompts/lifecycle-validation.md.hbs.
      # - Publishes these outputs: parent_number, branch_name, pull_number, prompt,
      #   target_file, and the artifact_path and result_path the agent writes into.
      #
      # **Keep this step first: every step below reads `steps.epic.outputs`.**
      - name: Prepare validation lifecycle
        id: epic
        uses: ainame/octestra@main
        with:
          operation: lifecycle/prepare-validation
          github-token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ inputs.issue-number }}

      - name: Checkout task branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.epic.outputs.branch_name }}
          token: ${{ steps.app-token.outputs.token }}

      # Publishes the agent's GitHub token as OCTESTRA_AGENT_GITHUB_TOKEN for the steps below.
      # Reference that name from the custom region below rather than the token step above: an
      # update replaces every step outside a custom region, so that step may move or disappear,
      # while this name remains valid. What this token is permitted to do may also narrow in a
      # later version, so do not rely on it having write access.
      - name: Expose agent credentials
        env:
          AGENT_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          printf 'OCTESTRA_AGENT_GITHUB_TOKEN=%s\n' "$AGENT_GITHUB_TOKEN" >> "$GITHUB_ENV"

      # octestra:custom:begin agent-steps
      # Everything between these markers is this repository's: environment and dependency
      # setup, credentials, the agent invocation itself, and any artifact upload. An update
      # carries it into the new version of this file.

      - name: Configure validation agent
        run: |
          echo "::error::Replace this step with the repository's validation agent configuration."
          exit 1

      # Example: configure cloud credentials with GitHub OIDC.
      #
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v6
      #   with:
      #     role-to-assume: arn:aws:iam::000000000000:role/example-role
      #     aws-region: example-region
      #
      # Example: replace the placeholder step above with Claude Code Action.
      # Do not set track_progress here: this workflow is triggered by an issue-field event.
      # Agent mode preserves the task branch checked out above instead of creating a branch.
      # `steps.epic.outputs.prompt` is rendered from
      # .github/octestra/prompts/lifecycle-validation.md.hbs.
      #
      # - name: Run Claude Code validation
      #   uses: anthropics/claude-code-action@v1
      #   with:
      #     github_token: ${{ env.OCTESTRA_AGENT_GITHUB_TOKEN }}
      #     use_bedrock: "true"
      #     claude_args: >-
      #       --model ${{ vars.BEDROCK_DEFAULT_OPUS_MODEL }}
      #       --allowedTools "Bash,Read,Write,Edit,Grep,Glob,mcp__XcodeBuildMCP__*"
      #     prompt: ${{ steps.epic.outputs.prompt }}

      # Upload partial evidence even when the validation agent fails.
      #
      # - name: Upload validation artifacts
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: octestra-validation-${{ inputs.issue-number }}
      #     path: |
      #       ${{ steps.epic.outputs.artifact_path }}
      #       ${{ steps.epic.outputs.result_path }}
      #     if-no-files-found: warn
      # octestra:custom:end agent-steps

      # finalize-validation:
      # - Reads the JSON file the agent wrote to result_path and posts it as a comment.
      # - Trusts the file's `outcome`, and does not cross-check `acceptance` or `checks`.
      # - On `passed`, assigns the Issue task owner to the pull request and requests review.
      # - Moves `passed` to Human Review and every other outcome to Blocked.
      # `operation: report-proof`, `request-review` and `update-status` do these one at a time.
      #
      # **Keep this step last: it reads what the agent steps above wrote.**
      - name: Finalize validation lifecycle
        uses: ainame/octestra@main
        with:
          operation: lifecycle/finalize-validation
          github-token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ inputs.issue-number }}
          proof-path: ${{ steps.epic.outputs.result_path }}
          pull-number: ${{ steps.epic.outputs.pull_number }}

  report-failure:
    needs: validation
    if: ${{ always() && needs.validation.result != 'success' }}
    runs-on: ${{ vars.OCTESTRA_ORCHESTRATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # An App token, not GITHUB_TOKEN: a change made with GITHUB_TOKEN starts no next run.
      - name: Generate a token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets.github_app_private_key }}

      - name: Report failure and advance to Blocked
        uses: ainame/octestra@main
        with:
          operation: lifecycle/report-failure
          github-token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ inputs.issue-number }}
