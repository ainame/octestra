# Octestra task-execution workflow.
#
# Runs the repository-configured implementation agent when a task enters the
# `In Progress` AI Task Status. The agent is expected to create the task branch
# and pull request; this workflow then advances the task to Validation or Human Review.
#
# UPDATING THIS FILE
# `.github/octestra/octestra.sh update` replaces this file, except for each custom region — the
# lines enclosed by a matching pair of
#
#     # octestra:custom:begin <name>
#     # octestra:custom:end <name>
#
# markers — whose contents it carries into the new version. Place this repository's setup, agent
# invocation and agent credentials inside a custom region; everything outside one is replaced, so
# edits there are lost on the next update.
#
# WHAT A CUSTOM REGION MAY REFERENCE
# An update preserves the contents of a custom region and replaces every step outside one, so a
# custom region may reference only names that survive that. These do:
#
#     steps.epic.outputs.*             the outputs listed on prepare-task below
#     env.OCTESTRA_AGENT_GITHUB_TOKEN  the agent's GitHub token
#     secrets.*, vars.*, inputs.*      declared in this file or passed by the caller
#
# Do not refer to any other step by its id. If a later version removes that step, GitHub turns
# the reference into an empty string instead of reporting an error, and the agent runs with an
# empty value.
#
# Leave the `Prepare task lifecycle` and `Finalize task lifecycle` steps outside the markers.
# Octestra keeps changing them, and an installation holding an old copy breaks. If an update
# cannot find a marker pair it expected — renamed or deleted by hand — it saves the previous
# file as `octestra-lifecycle-in-progress.yml.octestra-bak` and says so.
name: Octestra - In Progress (Task Execution)

on:
  workflow_call:
    inputs:
      issue-number:
        description: Task issue number
        required: true
        type: number
      trigger-actor:
        description: GitHub actor that initiated the status transition
        required: true
        type: string
      trigger-actor-type:
        description: GitHub sender type of the trigger actor (User or Bot)
        required: true
        type: string

    secrets:
      # GitHub App
      github_app_private_key:
        description: Private key for the Octestra GitHub App
        required: true

      # octestra:custom:begin agent-credentials
      # Declare the secrets the agent steps below need, and pass each one explicitly from
      # octestra-lifecycle.yml. Do not use `secrets: inherit` here: it would hand every
      # organization secret to a job that runs an agent.
      #
      #   your_agent_api_key:
      #     description: API key for the task agent
      #     required: true
      # octestra:custom:end agent-credentials

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  in-progress:
    name: Run task agent
    runs-on: ${{ vars.OCTESTRA_AGENT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    concurrency:
      group: octestra-${{ inputs.issue-number }}
      cancel-in-progress: false

    steps:
      # An App token, not GITHUB_TOKEN: a push or status change made with GITHUB_TOKEN
      # starts no next workflow run, and the task would stall here.
      - name: Generate a token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets.github_app_private_key }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      # prepare-task:
      # - Assigns the triggering user as task owner when the transition was made by a user.
      # - Loads the task issue and its parent EPIC.
      # - Renders .github/octestra/prompts/lifecycle-in-progress.md.hbs into `prompt`.
      # - Configures the task owner's Git co-author trailer for agent commits.
      # - Publishes these outputs for the task agent:
      #   - parent_number: parent EPIC issue number.
      #   - epic_id: the EPIC's id, used as the task branch prefix.
      #   - skill_name: agent skill named by the EPIC, if any.
      #   - branch_name: the branch the steps below must use.
      #   - task_ready: `false` when an existing branch or pull request stopped this task.
      #   - draft_flag: `--draft` when the PR should be a draft.
      #   - skip_validation: whether the task goes to Human Review without validation.
      #   - prompt: rendered task instructions.
      #   - target_file: configured target, if any.
      #   - task_owner: assigned human task owner.
      # `operation: assign-owner` and `operation: lifecycle/build-task-context` do the two halves
      # apart.
      #
      # **Keep this step first: every step below reads `steps.epic.outputs`.**
      - name: Prepare task lifecycle
        id: epic
        uses: ainame/octestra@main
        with:
          operation: lifecycle/prepare-task
          github-token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ inputs.issue-number }}
          trigger-actor: ${{ inputs.trigger-actor }}
          trigger-actor-type: ${{ inputs.trigger-actor-type }}

      # Publishes the agent's GitHub token as OCTESTRA_AGENT_GITHUB_TOKEN for the steps below.
      # Reference that name from the custom region below rather than the token step above: an
      # update replaces every step outside a custom region, so that step may move or disappear,
      # while this name remains valid.
      - name: Expose agent credentials
        env:
          AGENT_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          printf 'OCTESTRA_AGENT_GITHUB_TOKEN=%s\n' "$AGENT_GITHUB_TOKEN" >> "$GITHUB_ENV"

      # octestra:custom:begin agent-steps
      # Everything between these markers is this repository's: environment and dependency
      # setup, credentials, and the agent invocation itself. An update carries it into the new
      # version of this file.

      - name: Configure task agent
        id: agent
        if: steps.epic.outputs.task_ready == 'true'
        run: |
          echo "::error::Replace this step with the repository's task agent configuration."
          exit 1

      # Example: configure cloud credentials with GitHub OIDC.
      #
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v6
      #   with:
      #     role-to-assume: arn:aws:iam::000000000000:role/example-role
      #     aws-region: example-region
      #
      # Example: replace the placeholder step above with Claude Code Action.
      # `steps.epic.outputs.prompt` is rendered from
      # .github/octestra/prompts/lifecycle-in-progress.md.hbs.
      #
      # - name: Run Claude Code
      #   id: agent
      #   uses: anthropics/claude-code-action@v1
      #   with:
      #     anthropic_api_key: ${{ secrets.YOUR_AGENT_API_KEY }}
      #     github_token: ${{ env.OCTESTRA_AGENT_GITHUB_TOKEN }}
      #     track_progress: true
      #     # `branch_name` is the exact branch Octestra will later finalize and validate.
      #     # Passing it through `{{prefix}}` prevents Claude from adding any suffix.
      #     branch_prefix: ${{ steps.epic.outputs.branch_name }}
      #     branch_name_template: "{{prefix}}"
      #     claude_args: >-
      #       --allowedTools
      #       "Bash,Read,Write,Edit,Grep,Glob"
      #     prompt: ${{ steps.epic.outputs.prompt }}
      # octestra:custom:end agent-steps

      # finalize-task:
      # - Confirms the agent pushed the branch named by branch_name above.
      # - Finds the open pull request made from that branch.
      # - When the next status is Human Review, takes the pull request out of draft and
      #   requests review from the Issue task owner.
      # - Moves the task to its next status and comments on the issue with the result.
      # `operation: request-review` and `operation: update-status` do these one at a time.
      #
      # **Keep this step last: it reports what the agent steps above did.**
      - name: Finalize task lifecycle
        if: steps.epic.outputs.task_ready == 'true'
        uses: ainame/octestra@main
        with:
          operation: lifecycle/finalize-task
          github-token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ inputs.issue-number }}

  report-failure:
    needs: in-progress
    if: ${{ always() && needs.in-progress.result != 'success' }}
    runs-on: ${{ vars.OCTESTRA_ORCHESTRATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # An App token, not GITHUB_TOKEN: a change made with GITHUB_TOKEN starts no next run.
      - name: Generate a token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets.github_app_private_key }}

      - name: Report failure and advance to Blocked
        uses: ainame/octestra@main
        with:
          operation: lifecycle/report-failure
          github-token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ inputs.issue-number }}
