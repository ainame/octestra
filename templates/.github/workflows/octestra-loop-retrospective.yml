name: Octestra Loop - Retrospective
run-name: "Octestra loop: retrospective${{ inputs.dry-run && ' (dry run)' || '' }}"
# Aggregate loop: one agent run over the whole selection, producing a single pull request that
# improves the prompts or skills Octestra uses. Compare with octestra-loop-triage-todo.yml, which
# fans out to one agent run per issue.
on:
  # Loops are opt-in. Uncomment to enable the schedule.
  # schedule:
  #   - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report the planned changes without opening a pull request
        type: boolean
        default: true
      config-ref:
        description: Branch to read .github/octestra/config.yml from
        type: string
        default: ""
permissions:
  contents: read
  issues: write
env:
  LOOP_CONTEXT: |
    {
      "loop_id": "retrospective",
      "dry_run": ${{ inputs.dry-run || false }}
    }
jobs:
  select:
    runs-on: ${{ vars.OCTESTRA_ORCHESTRATION_RUNNER || 'ubuntu-latest' }}
    outputs:
      issues: ${{ steps.select.outputs.issues }}
      loop_ready: ${{ steps.select.outputs.loop_ready }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets.OCTESTRA_GITHUB_APP_PRIVATE_KEY }}
      - id: select
        uses: ainame/octestra@main
        with:
          operation: loop/select-tasks
          github-token: ${{ steps.app-token.outputs.token }}
          loop-context: ${{ env.LOOP_CONTEXT }}
          config-ref: ${{ inputs.config-ref }}
      - name: Record the selection
        run: |
          printf '## Retrospective selection\n\n%s\n' "${DIGEST}" >>"${GITHUB_STEP_SUMMARY}"
        env:
          DIGEST: ${{ steps.select.outputs.digest }}
  agent:
    needs: select
    if: needs.select.outputs.loop_ready == 'true'
    runs-on: ${{ vars.OCTESTRA_AGENT_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      branch_name: ${{ steps.loop.outputs.branch_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: loop
        uses: ainame/octestra@main
        with:
          operation: loop/prepare-run
          github-token: ${{ github.token }}
          loop-context: ${{ env.LOOP_CONTEXT }}
          config-ref: ${{ inputs.config-ref }}
          loop-issues: ${{ needs.select.outputs.issues }}
      # Replace this step with the repository's agent. It receives the rendered prompt in
      # steps.loop.outputs.prompt and must write its result document to
      # steps.loop.outputs.result_path. It must NOT push or open a pull request itself: this job
      # holds no privileged token by design.
      - name: Configure loop agent
        run: |
          echo "::error::Replace this step with the repository's loop agent configuration."
          exit 1
      # The agent leaves its proposed edits in the working tree. They cross into the trusted job as
      # a patch, never as a push. Octestra's own run files live in the workspace too, so they are
      # excluded rather than committed into the patch.
      - name: Capture the proposed changes
        run: |
          set -euo pipefail
          git add --intent-to-add --all -- . ':(exclude)octestra-loop-*'
          git diff --binary -- . ':(exclude)octestra-loop-*' >"${PATCH_PATH}"
        env:
          PATCH_PATH: ${{ steps.loop.outputs.patch_path }}
      - uses: actions/upload-artifact@v4
        with:
          name: octestra-loop-retrospective
          path: |
            ${{ steps.loop.outputs.result_path }}
            ${{ steps.loop.outputs.patch_path }}
  finalize:
    needs: [select, agent]
    if: always() && needs.select.outputs.loop_ready == 'true'
    runs-on: ${{ vars.OCTESTRA_ORCHESTRATION_RUNNER || 'ubuntu-latest' }}
    steps:
      # Downloaded outside the workspace: actions/checkout below deletes the workspace contents.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        id: result
        with:
          name: octestra-loop-retrospective
          path: ${{ runner.temp }}/octestra-result
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets.OCTESTRA_GITHUB_APP_PRIVATE_KEY }}
      # Only the pull request step below needs a workspace, and it is skipped on a dry
      # run. loop/finalize-run reads the proof from runner.temp, so guard both alike.
      - if: steps.result.outcome == 'success' && !(inputs.dry-run || false)
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      # The patch is agent-produced data, so it lands on a branch behind a pull request and is never
      # applied to the default branch. Protect the default branch with a ruleset the Octestra App
      # cannot bypass, and require review on these pull requests.
      - name: Open the improvement pull request
        if: steps.result.outcome == 'success' && !(inputs.dry-run || false)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH_NAME: ${{ needs.agent.outputs.branch_name }}
          PATCH_PATH: ${{ runner.temp }}/octestra-result/octestra-loop-retrospective.patch
        run: |
          set -euo pipefail
          if [ ! -s "${PATCH_PATH}" ]; then
            echo "Retrospective proposed no changes."
            exit 0
          fi
          git config user.name "octestra[bot]"
          git config user.email "octestra[bot]@users.noreply.github.com"
          git switch --create "${BRANCH_NAME}"
          git apply --whitespace=nowarn "${PATCH_PATH}"
          git add --all
          git commit --message "Octestra retrospective: improve task prompts and skills"
          git push origin "${BRANCH_NAME}"
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${BRANCH_NAME}" \
            --title "Octestra retrospective: improve task prompts and skills" \
            --body "Opened by the Octestra retrospective loop from run ${GITHUB_RUN_ID}."
      - if: steps.result.outcome == 'success'
        uses: ainame/octestra@main
        with:
          operation: loop/finalize-run
          github-token: ${{ steps.app-token.outputs.token }}
          loop-context: ${{ env.LOOP_CONTEXT }}
          config-ref: ${{ inputs.config-ref }}
          proof-path: ${{ runner.temp }}/octestra-result/octestra-loop-retrospective.json
      - if: steps.result.outcome != 'success'
        uses: ainame/octestra@main
        with:
          operation: loop/report-failure
          github-token: ${{ steps.app-token.outputs.token }}
          loop-context: ${{ env.LOOP_CONTEXT }}
          config-ref: ${{ inputs.config-ref }}
