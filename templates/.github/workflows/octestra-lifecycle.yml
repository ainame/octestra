name: Octestra Lifecycle
on:
  issues:
    types: [field_added, closed]
permissions:
  # These are the workflow-level permissions, which serve as the ceiling for every
  # called reusable workflow. A callee that declares a permission this ceiling does
  # not grant fails the entire run with startup_failure before any job is created —
  # so the caller must be a superset of every callee (in-progress needs contents:
  # write for pushes, validation and both need pull-requests: write for PR handling).
  # Individual jobs still narrow this at the job level.
  contents: write
  # Uncomment for OIDC federation, for example AWS IAM role assumption with
  # aws-actions/configure-aws-credentials. This is the only place id-token needs to
  # be declared — the reusable workflows below inherit it from here.
  # id-token: write
  issues: write
  pull-requests: write
jobs:
  # Validate lifecycle transitions before dispatching status-specific jobs.
  guard:
    if: github.event.action == 'field_added' && format('{0}', github.event.issue_field.id) == vars.OCTESTRA_STATUS_FIELD_ID
    runs-on: ${{ vars.OCTESTRA_ORCHESTRATION_RUNNER || 'ubuntu-latest' }}
    # Narrow the workflow-level ceiling to what guard actually uses. The reusable
    # workflows below still see the full ceiling because job-level permissions only
    # apply to this job, not to the ones started by `uses:`.
    permissions:
      contents: read
      issues: read
    outputs:
      valid: ${{ steps.guard.outputs.transition_valid }}
      status_key: ${{ steps.guard.outputs.status_key }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets.OCTESTRA_GITHUB_APP_PRIVATE_KEY }}
      - id: guard
        uses: ainame/octestra@main
        with:
          operation: lifecycle/validate-transition
          github-token: ${{ steps.app-token.outputs.token }}
          lifecycle-context: |-
            {
              "issue_number": ${{ github.event.issue.number }},
              "previous_status": ${{ toJSON(github.event.changes.issue_field_value.from.option.name) }},
              "current_status": ${{ toJSON(github.event.issue_field_value.option.name) }},
              "trigger_actor": ${{ toJSON(github.actor) }},
              "trigger_actor_type": ${{ toJSON(github.event.sender.type) }}
            }
          platform-vars: |-
            {
              "OCTESTRA_GITHUB_APP_CLIENT_ID": ${{ toJSON(vars.OCTESTRA_GITHUB_APP_CLIENT_ID) }},
              "OCTESTRA_ORCHESTRATION_RUNNER": ${{ toJSON(vars.OCTESTRA_ORCHESTRATION_RUNNER) }},
              "OCTESTRA_AGENT_RUNNER": ${{ toJSON(vars.OCTESTRA_AGENT_RUNNER) }},
              "OCTESTRA_STATUS_FIELD_ID": ${{ toJSON(vars.OCTESTRA_STATUS_FIELD_ID) }}
            }

  # ========================================================================
  # Consumer lifecycle entrypoints: customize the reusable workflows below.
  # ========================================================================
  in-progress:
    # Consumer entrypoint for task implementation.
    needs: guard
    if: needs.guard.outputs.valid == 'true' && needs.guard.outputs.status_key == 'in_progress'
    uses: ./.github/workflows/octestra-lifecycle-in-progress.yml
    with:
      lifecycle-context: |-
        {
          "issue_number": ${{ github.event.issue.number }},
          "trigger_actor": ${{ toJSON(github.actor) }},
          "trigger_actor_type": ${{ toJSON(github.event.sender.type) }}
        }
    secrets:
      github_app_private_key: ${{ secrets.OCTESTRA_GITHUB_APP_PRIVATE_KEY }}
  validation:
    # Consumer entrypoint for task validation.
    needs: guard
    if: needs.guard.outputs.valid == 'true' && needs.guard.outputs.status_key == 'validation'
    uses: ./.github/workflows/octestra-lifecycle-validation.yml
    with:
      lifecycle-context: |-
        {
          "issue_number": ${{ github.event.issue.number }}
        }
    secrets:
      github_app_private_key: ${{ secrets.OCTESTRA_GITHUB_APP_PRIVATE_KEY }}

  # Add the matching reusable workflow, then uncomment a status job to enable it.
  # todo:
  #   needs: guard
