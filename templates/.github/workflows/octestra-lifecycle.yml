  #   with:
  #     github-app-client-id: ${{ inputs.github-app-client-id }}
  #     lifecycle-context: ${{ inputs.lifecycle-context }}
  #     workflow-context: ${{ inputs.workflow-context }}

  in-progress:
    name: In Progress
    needs: transition-guard
    if: >-
      needs.transition-guard.outputs.valid == 'true' &&
      fromJSON(inputs.lifecycle-context).current_status_option_id == fromJSON(inputs.lifecycle-context).status_option_ids.in_progress
    uses: ./.github/workflows/octestra-in-progress.yml
    secrets:
      github_app_private_key: ${{ secrets.github_app_private_key }}
    with:
      github-app-client-id: ${{ inputs.github-app-client-id }}
      lifecycle-context: ${{ inputs.lifecycle-context }}
      workflow-context: ${{ inputs.workflow-context }}

  validation:
    name: Validation
    needs: transition-guard
    if: >-
      needs.transition-guard.outputs.valid == 'true' &&
      fromJSON(inputs.lifecycle-context).current_status_option_id == fromJSON(inputs.lifecycle-context).status_option_ids.validation
    uses: ./.github/workflows/octestra-validation.yml
    secrets:
      github_app_private_key: ${{ secrets.github_app_private_key }}
    with:
      github-app-client-id: ${{ inputs.github-app-client-id }}
      lifecycle-context: ${{ inputs.lifecycle-context }}
      workflow-context: ${{ inputs.workflow-context }}

