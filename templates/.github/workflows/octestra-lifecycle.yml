name: Octestra Lifecycle
on:
  issues:
    types: [field_added, closed]
permissions:
  contents: read
  issues: write
jobs:
  guard:
    if: github.event.action == 'field_added' && format('{0}', github.event.issue_field.id) == vars.OCTESTRA_STATUS_FIELD_ID
    runs-on: ${{ vars.OCTESTRA_ORCHESTRATION_RUNNER || 'ubuntu-latest' }}
    outputs:
      valid: ${{ steps.guard.outputs.transition_valid }}
      status_key: ${{ steps.guard.outputs.status_key }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets.OCTESTRA_GITHUB_APP_PRIVATE_KEY }}
      - id: guard
        uses: ainame/octestra@main
        with:
          operation: lifecycle/validate-transition
          github-token: ${{ steps.app-token.outputs.token }}
          lifecycle-context: >-
            {"issue_number":${{ github.event.issue.number }},"previous_status":${{ toJSON(github.event.changes.issue_field_value.from) }},"current_status":${{ toJSON(github.event.issue_field_value.value) }},"trigger_actor":${{ toJSON(github.actor) }},"trigger_actor_type":${{ toJSON(github.event.sender.type) }}}
          platform-vars: >-
            {"OCTESTRA_GITHUB_APP_CLIENT_ID":${{ toJSON(vars.OCTESTRA_GITHUB_APP_CLIENT_ID) }},"OCTESTRA_ORCHESTRATION_RUNNER":${{ toJSON(vars.OCTESTRA_ORCHESTRATION_RUNNER) }},"OCTESTRA_AGENT_RUNNER":${{ toJSON(vars.OCTESTRA_AGENT_RUNNER) }},"OCTESTRA_STATUS_FIELD_ID":${{ toJSON(vars.OCTESTRA_STATUS_FIELD_ID) }}}
  in-progress:
    needs: guard
    if: needs.guard.outputs.valid == 'true' && needs.guard.outputs.status_key == 'in_progress'
    uses: ./.github/workflows/octestra-lifecycle-in-progress.yml
    with:
      lifecycle-context: >-
        {"issue_number":${{ github.event.issue.number }},"trigger_actor":${{ toJSON(github.actor) }},"trigger_actor_type":${{ toJSON(github.event.sender.type) }}}
    secrets:
      github_app_private_key: ${{ secrets.OCTESTRA_GITHUB_APP_PRIVATE_KEY }}
  validation:
    needs: guard
    if: needs.guard.outputs.valid == 'true' && needs.guard.outputs.status_key == 'validation'
    uses: ./.github/workflows/octestra-lifecycle-validation.yml
    with:
      lifecycle-context: >-
        {"issue_number":${{ github.event.issue.number }}}
    secrets:
      github_app_private_key: ${{ secrets.OCTESTRA_GITHUB_APP_PRIVATE_KEY }}
  merged:
    if: github.event.action == 'closed'
    runs-on: ${{ vars.OCTESTRA_ORCHESTRATION_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets.OCTESTRA_GITHUB_APP_PRIVATE_KEY }}
      - uses: ainame/octestra@main
        with:
          operation: lifecycle/finalize-merged-task
          github-token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ github.event.issue.number }}
