# Octestra starts here: GitHub runs this workflow when a task issue's Issue Field changes and
# runs the job for the status the task moved to.
#
# `.github/octestra/octestra.sh update` replaces this file. Agent setup belongs in the local
# composite actions under `.github/octestra/actions/`, which updates preserve in full.
name: Octestra Lifecycle
on:
  issues:
    types: [field_added, closed]
permissions:
  # Agent jobs inherit these permissions. Jobs that need less narrow them below.
  contents: write
  # Uncomment for OIDC federation, for example AWS IAM role assumption with
  # aws-actions/configure-aws-credentials. This is the only place id-token needs to
  # be declared.
  # id-token: write
  issues: write
  pull-requests: write
jobs:
  # Checks the status change is one Octestra allows, and reports which status job to run.
  guard:
    # Todo creates the task, Ready queues it, and In Progress explicitly starts work. Only workflow-managed
    # statuses run the guard, so setup and status cleanup need no App secret.
    if: github.event.action == 'field_added' && github.event.issue_field_value.option.name != 'Todo' && github.event.issue_field_value.option.name != 'Ready' && github.event.issue_field_value.option.name != 'Done' && format('{0}', github.event.issue_field.id) == vars.OCTESTRA_STATUS_FIELD_ID
    runs-on: ${{ vars.OCTESTRA_ORCHESTRATION_RUNNER || 'ubuntu-latest' }}
    # This job only reads, so it takes less than the list above. Job-level permissions apply
    # only to this job.
    permissions:
      contents: read
      issues: read
    outputs:
      valid: ${{ steps.guard.outputs.transition_valid }}
      status_key: ${{ steps.guard.outputs.status_key }}
      # config.yml agent_timeout_minutes for the routed status, plus 10 minutes for the steps
      # around the agent; config.yml explains the path. The status jobs below cannot read the
      # file before they start, so the guard publishes the number for them. The `|| '60'` next
      # to each use only keeps fromJSON from failing on an empty value when this job did not run.
      job_timeout_minutes: ${{ steps.guard.outputs.job_timeout_minutes }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets[vars.OCTESTRA_GITHUB_APP_PRIVATE_KEY_SECRET || 'OCTESTRA_GITHUB_APP_PRIVATE_KEY'] }}
      - id: guard
        uses: ainame/octestra@main
        with:
          operation: lifecycle/validate-transition
          github_token: ${{ steps.app-token.outputs.token }}
          issue_number: ${{ github.event.issue.number }}
          previous_status: ${{ github.event.changes.issue_field_value.from.option.name }}
          current_status: ${{ github.event.issue_field_value.option.name }}
          trigger_actor: ${{ github.actor }}
          trigger_actor_type: ${{ github.event.sender.type }}

  # Runs the repository-configured implementation agent when a task enters In Progress.
  in-progress:
    needs: guard
    if: needs.guard.outputs.valid == 'true' && needs.guard.outputs.status_key == 'in_progress'
    name: Run task agent
    runs-on: ${{ vars.OCTESTRA_AGENT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(needs.guard.outputs.job_timeout_minutes || '60') }}
    concurrency:
      group: octestra-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # An App token, not GITHUB_TOKEN: a push or status change made with GITHUB_TOKEN
      # starts no next workflow run, and the task would stall here.
      - name: Generate a token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets[vars.OCTESTRA_GITHUB_APP_PRIVATE_KEY_SECRET || 'OCTESTRA_GITHUB_APP_PRIVATE_KEY'] }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      # prepare-task:
      # - Assigns the triggering user as task owner when the transition was made by a user.
      # - Loads the task issue and its parent EPIC.
      # - Renders .github/octestra/prompts/lifecycle-in-progress.md.hbs into `prompt`.
      # - Configures the task owner's Git co-author trailer for agent commits.
      # - Publishes these outputs for the task agent:
      #   - parent_number: parent EPIC issue number.
      #   - epic_id: the EPIC's id, used as the task branch prefix.
      #   - task_skill: task agent skill named by the EPIC, if any.
      #   - branch_name: the branch the steps below must use.
      #   - task_ready: `false` when an existing branch or pull request stopped this task.
      #   - draft_flag: `--draft` when the PR should be a draft.
      #   - skip_validation: whether the task goes to Human Review without validation.
      #   - prompt: rendered task instructions.
      #   - target: configured file, class, feature, or other target, if any.
      #   - task_owner: assigned human task owner.
      # `operation: assign-owner` and `operation: lifecycle/build-task-context` do the two halves
      # apart.
      #
      # **Keep this step first: every step below reads `steps.epic.outputs`.**
      - name: Prepare task lifecycle
        id: epic
        uses: ainame/octestra@main
        with:
          operation: lifecycle/prepare-task
          github_token: ${{ steps.app-token.outputs.token }}
          issue_number: ${{ github.event.issue.number }}
          trigger_actor: ${{ github.actor }}
          trigger_actor_type: ${{ github.event.sender.type }}

      # The local composite action groups every repository-defined setup and agent step behind this
      # one condition. It runs in this job, on the same runner and workspace as prepare-task.
      # The cap is config.yml agent_timeout_minutes.task, published by prepare-task above; when it
      # hits, this step fails, the steps inside the action stop, and the steps below still run.
      - name: Run task agent
        if: steps.epic.outputs.task_ready == 'true'
        timeout-minutes: ${{ fromJSON(steps.epic.outputs.agent_timeout_minutes || '50') }}
        uses: ./.github/octestra/actions/task-agent
        env:
          OCTESTRA_AGENT_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          OCTESTRA_AGENT_DEBUG: ${{ vars.OCTESTRA_AGENT_DEBUG == 'true' }}
        with:
          issue_number: ${{ github.event.issue.number }}
          parent_number: ${{ steps.epic.outputs.parent_number }}
          epic_id: ${{ steps.epic.outputs.epic_id }}
          task_skill: ${{ steps.epic.outputs.task_skill }}
          branch_name: ${{ steps.epic.outputs.branch_name }}
          draft_flag: ${{ steps.epic.outputs.draft_flag }}
          skip_validation: ${{ steps.epic.outputs.skip_validation }}
          prompt: ${{ steps.epic.outputs.prompt }}
          target: ${{ steps.epic.outputs.target }}
          task_owner: ${{ steps.epic.outputs.task_owner }}

      # The first token expires one hour after it was created, and the agent may have run longer.
      # Every step below uses this fresh one.
      - name: Refresh the token from GitHub App
        id: app-token-refreshed
        if: always() && steps.epic.outputs.task_ready == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets[vars.OCTESTRA_GITHUB_APP_PRIVATE_KEY_SECRET || 'OCTESTRA_GITHUB_APP_PRIVATE_KEY'] }}

      # finalize-task:
      # - Confirms the agent pushed the branch named by branch_name above.
      # - Finds the open pull request made from that branch.
      # - When the next status is Human Review, takes the pull request out of draft and
      #   requests review from the Issue task owner.
      # - Moves the task to its next status and comments on the issue with the result.
      # `operation: request-review` and `operation: update-status` do these one at a time.
      #
      # **Keep this step last: it reports what the agent steps above did using the branch and
      # validation policy fixed by prepare-task.**
      - name: Finalize task lifecycle
        if: steps.epic.outputs.task_ready == 'true'
        uses: ainame/octestra@main
        with:
          operation: lifecycle/finalize-task
          github_token: ${{ steps.app-token-refreshed.outputs.token }}
          issue_number: ${{ github.event.issue.number }}
          branch_name: ${{ steps.epic.outputs.branch_name }}
          skip_validation: ${{ steps.epic.outputs.skip_validation }}

  # Runs the repository-configured validation agent when a task enters Validation.
  validation:
    needs: guard
    if: needs.guard.outputs.valid == 'true' && needs.guard.outputs.status_key == 'validation'
    name: Run validation agent
    runs-on: ${{ vars.OCTESTRA_AGENT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(needs.guard.outputs.job_timeout_minutes || '60') }}
    concurrency:
      group: octestra-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # An App token, not GITHUB_TOKEN: a change made with GITHUB_TOKEN starts no next run.
      - name: Generate a token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets[vars.OCTESTRA_GITHUB_APP_PRIVATE_KEY_SECRET || 'OCTESTRA_GITHUB_APP_PRIVATE_KEY'] }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      # prepare-validation:
      # - Loads the task issue and its parent EPIC.
      # - Finds the open pull request linked to the task.
      # - Renders .github/octestra/prompts/lifecycle-validation.md.hbs.
      # - Publishes these outputs: parent_number, validation_skill, branch_name, pull_number,
      #   prompt, target, and the artifact_path and result_path the agent writes into.
      #
      # **Keep this step first: every step below reads `steps.epic.outputs`.**
      - name: Prepare validation lifecycle
        id: epic
        uses: ainame/octestra@main
        with:
          operation: lifecycle/prepare-validation
          github_token: ${{ steps.app-token.outputs.token }}
          issue_number: ${{ github.event.issue.number }}

      - name: Checkout task branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.epic.outputs.branch_name }}
          token: ${{ steps.app-token.outputs.token }}

      # The local composite action runs in this job, on the same runner and checked-out workspace
      # as prepare-validation. The cap is config.yml agent_timeout_minutes.validation, published
      # by prepare-validation above; when it hits, this step fails, the steps inside the action
      # stop, and the upload below still runs, which is why the upload is not inside the action.
      - name: Run validation agent
        timeout-minutes: ${{ fromJSON(steps.epic.outputs.agent_timeout_minutes || '50') }}
        uses: ./.github/octestra/actions/validation-agent
        env:
          OCTESTRA_AGENT_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          OCTESTRA_AGENT_DEBUG: ${{ vars.OCTESTRA_AGENT_DEBUG == 'true' }}
        with:
          issue_number: ${{ github.event.issue.number }}
          parent_number: ${{ steps.epic.outputs.parent_number }}
          validation_skill: ${{ steps.epic.outputs.validation_skill }}
          branch_name: ${{ steps.epic.outputs.branch_name }}
          pull_number: ${{ steps.epic.outputs.pull_number }}
          prompt: ${{ steps.epic.outputs.prompt }}
          result_path: ${{ steps.epic.outputs.result_path }}
          artifact_path: ${{ steps.epic.outputs.artifact_path }}
          target: ${{ steps.epic.outputs.target }}

      # The first token expires one hour after it was created, and the agent may have run longer.
      # Every step below uses this fresh one.
      - name: Refresh the token from GitHub App
        id: app-token-refreshed
        if: always()
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets[vars.OCTESTRA_GITHUB_APP_PRIVATE_KEY_SECRET || 'OCTESTRA_GITHUB_APP_PRIVATE_KEY'] }}

      # upload-artifacts:
      # - Publishes every file the agent saved under artifact_path, and the result JSON, as its
      #   own artifact, so the proof comment can link each file and a browser opens it directly.
      # - `if: always()` keeps whatever exists when the agent failed or timed out.
      # - A file that fails to upload is logged and skipped, so the finalize step still runs.
      # Without this step reviewers can only read the paths the agent wrote, not open the files.
      - name: Upload validation artifacts
        id: artifacts
        if: always()
        uses: ainame/octestra@main
        with:
          operation: upload-artifacts
          github_token: ${{ steps.app-token-refreshed.outputs.token }}
          artifact_path: ${{ steps.epic.outputs.artifact_path }}
          result_path: ${{ steps.epic.outputs.result_path }}

      # finalize-validation:
      # - Reads the JSON file the agent wrote to result_path and posts it as a comment.
      # - Links the uploaded files from the comment when artifact_links is given.
      # - Trusts the file's `outcome`, and does not cross-check `acceptance` or `checks`.
      # - On a blocked result, assigns the Issue task owner to the pull request.
      # - On `passed`, requests review from the Issue task owner.
      # - Moves `passed` to Human Review and every other outcome to Blocked.
      # `operation: report-proof`, `request-review` and `update-status` do these one at a time.
      #
      # **Keep this step last: it reads what the agent steps above wrote.**
      - name: Finalize validation lifecycle
        uses: ainame/octestra@main
        with:
          operation: lifecycle/finalize-validation
          github_token: ${{ steps.app-token-refreshed.outputs.token }}
          issue_number: ${{ github.event.issue.number }}
          result_path: ${{ steps.epic.outputs.result_path }}
          pull_number: ${{ steps.epic.outputs.pull_number }}
          artifact_links: ${{ steps.artifacts.outputs.artifact_links }}

  report-failure:
    name: Report lifecycle failure
    needs:
      - in-progress
      - validation
    if: >-
      ${{
        always() &&
        (
          needs.in-progress.result == 'failure' ||
          needs.in-progress.result == 'cancelled' ||
          needs.validation.result == 'failure' ||
          needs.validation.result == 'cancelled'
        )
      }}
    runs-on: ${{ vars.OCTESTRA_ORCHESTRATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # An App token, not GITHUB_TOKEN: a change made with GITHUB_TOKEN starts no next run.
      - name: Generate a token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets[vars.OCTESTRA_GITHUB_APP_PRIVATE_KEY_SECRET || 'OCTESTRA_GITHUB_APP_PRIVATE_KEY'] }}

      - name: Report failure and advance to Blocked
        uses: ainame/octestra@main
        with:
          operation: lifecycle/report-failure
          github_token: ${{ steps.app-token.outputs.token }}
          issue_number: ${{ github.event.issue.number }}

  # Finalize tasks closed because their linked pull request was merged.
  merged-task-finalization:
    name: Finalize merged task
    if: github.event.action == 'closed'
    runs-on: ${{ vars.OCTESTRA_ORCHESTRATION_RUNNER || 'ubuntu-latest' }}
    # Less than the list above: this job only reads code and writes the issue.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets[vars.OCTESTRA_GITHUB_APP_PRIVATE_KEY_SECRET || 'OCTESTRA_GITHUB_APP_PRIVATE_KEY'] }}
      - uses: ainame/octestra@main
        with:
          operation: lifecycle/finalize-merged-task
          github_token: ${{ steps.app-token.outputs.token }}
          issue_number: ${{ github.event.issue.number }}
