# Octestra starts here: GitHub runs this workflow when a task issue's Issue Field changes,
# and it calls the workflow for the status the task moved to.
#
# `.github/octestra/octestra.sh update` replaces this file. Agent setup belongs in the local
# composite actions under `.github/octestra/actions/`, which updates preserve in full.
name: Octestra Lifecycle
on:
  issues:
    types: [field_added, closed]
permissions:
  # Every workflow this file starts with `uses:` is limited to the permissions listed
  # here. If one of them asks for a permission this list omits, the whole run fails
  # with startup_failure before any job starts — no logs, no annotation. So keep this
  # list a superset of the `permissions:` in every octestra-lifecycle-*.yml you enable.
  # Jobs below still narrow it for themselves.
  contents: write
  # Uncomment for OIDC federation, for example AWS IAM role assumption with
  # aws-actions/configure-aws-credentials. This is the only place id-token needs to
  # be declared — the reusable workflows below inherit it from here.
  # id-token: write
  issues: write
  pull-requests: write
jobs:
  # Checks the status change is one Octestra allows, and reports which status job to run.
  guard:
    # Todo creates the task, Ready authorizes work, and Done ends it. Only workflow-managed
    # statuses run the guard, so setup and status cleanup need no App secret.
    if: github.event.action == 'field_added' && github.event.issue_field_value.option.name != 'Todo' && github.event.issue_field_value.option.name != 'Ready' && github.event.issue_field_value.option.name != 'Done' && format('{0}', github.event.issue_field.id) == vars.OCTESTRA_STATUS_FIELD_ID
    runs-on: ${{ vars.OCTESTRA_ORCHESTRATION_RUNNER || 'ubuntu-latest' }}
    # This job only reads, so it takes less than the list above. Jobs started by
    # `uses:` are unaffected: job-level permissions apply to this job only.
    permissions:
      contents: read
      issues: read
    outputs:
      valid: ${{ steps.guard.outputs.transition_valid }}
      status_key: ${{ steps.guard.outputs.status_key }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets[vars.OCTESTRA_GITHUB_APP_PRIVATE_KEY_SECRET || 'OCTESTRA_GITHUB_APP_PRIVATE_KEY'] }}
      - id: guard
        uses: ainame/octestra@main
        with:
          operation: lifecycle/validate-transition
          github-token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ github.event.issue.number }}
          previous-status: ${{ github.event.changes.issue_field_value.from.option.name }}
          current-status: ${{ github.event.issue_field_value.option.name }}
          trigger-actor: ${{ github.actor }}
          trigger-actor-type: ${{ github.event.sender.type }}

  # ========================================================================
  # Status jobs. Edit the workflow file each one calls, not the job itself.
  # ========================================================================
  in-progress:
    # Runs when a task moves to In Progress.
    needs: guard
    if: needs.guard.outputs.valid == 'true' && needs.guard.outputs.status_key == 'in_progress'
    uses: ./.github/workflows/octestra-lifecycle-in-progress.yml
    with:
      issue-number: ${{ github.event.issue.number }}
      trigger-actor: ${{ github.actor }}
      trigger-actor-type: ${{ github.event.sender.type }}
    secrets:
      github_app_private_key: ${{ secrets[vars.OCTESTRA_GITHUB_APP_PRIVATE_KEY_SECRET || 'OCTESTRA_GITHUB_APP_PRIVATE_KEY'] }}

  validation:
    # Runs when a task moves to Validation.
    needs: guard
    if: needs.guard.outputs.valid == 'true' && needs.guard.outputs.status_key == 'validation'
    uses: ./.github/workflows/octestra-lifecycle-validation.yml
    with:
      issue-number: ${{ github.event.issue.number }}
    secrets:
      github_app_private_key: ${{ secrets[vars.OCTESTRA_GITHUB_APP_PRIVATE_KEY_SECRET || 'OCTESTRA_GITHUB_APP_PRIVATE_KEY'] }}

  # Finalize tasks closed because their linked pull request was merged.
  merged-task-finalization:
    name: Finalize merged task
    if: github.event.action == 'closed'
    runs-on: ${{ vars.OCTESTRA_ORCHESTRATION_RUNNER || 'ubuntu-latest' }}
    # Less than the list above: this job only reads code and writes the issue.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.OCTESTRA_GITHUB_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets[vars.OCTESTRA_GITHUB_APP_PRIVATE_KEY_SECRET || 'OCTESTRA_GITHUB_APP_PRIVATE_KEY'] }}
      - uses: ainame/octestra@main
        with:
          operation: lifecycle/finalize-merged-task
          github-token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ github.event.issue.number }}
