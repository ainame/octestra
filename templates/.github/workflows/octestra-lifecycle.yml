  #   if: >-
  #     needs.transition-guard.outputs.valid == 'true' &&
  #     fromJSON(inputs.lifecycle-context).current_status_option_id == fromJSON(inputs.lifecycle-context).status_option_ids.ready
  #   uses: ./.github/workflows/octestra-ready.yml
  #   secrets:
