name: Octestra - Complete Merged Task

on:
  workflow_call:
    inputs:
      github-app-client-id:
        description: GitHub App client ID used for task API requests
        required: true
        type: string
      issue-number:
        description: Closed Issue number
        required: true
        type: number
      status-field-name:
        description: Organization Issue Field name
        required: true
        type: string
      workflow-context:
        description: JSON object containing runners and a task branch template
        required: true
        type: string
    secrets:
      github_app_private_key:
        description: Private key for the task GitHub App
        required: true

permissions:
  contents: write
  # Enable only for OIDC federation, for example AWS IAM role assumption with
  # aws-actions/configure-aws-credentials; also enable it in octestra-orchestrator.yml and octestra-lifecycle.yml.
  # id-token: write
  issues: write
  pull-requests: write

jobs:
  finalize-merged-task:
    name: Complete closed task
    runs-on: ${{ fromJSON(inputs.workflow-context).runners.orchestration }}
    timeout-minutes: 5
    steps:
      - name: Generate a token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.github-app-client-id }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          private-key: ${{ secrets.github_app_private_key }}

      - name: Complete task closed by a merged pull request
        uses: ainame/octestra@main
        with:
          operation: finalize-merged-task
          github-token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ inputs.issue-number }}
          status-field-name: ${{ inputs.status-field-name }}
